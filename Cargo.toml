[package]
name = "alumina"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Alumina phase-1 foundations: F0 toolchain pin, F1/F2/F4 witness scaffolds"

# SM-01: per-lint rollout proof — enable one pedantic lint and fix all its
# sites. `uninlined_format_args` is pure formatting; args are inlined at every
# site and no suppression is expected.
# SM-02: enable the second pedantic lint — `must_use_candidate` — and resolve
# every site with idiomatic `#[must_use]` (public API) or
# `#[expect(clippy::must_use_candidate, reason = "...")]` (test-local/private,
# value legitimately ignored). No runtime impact; attributes are compile-time.
# SM-04: enable the doc/hygiene cluster — `missing_errors_doc` and
# `missing_panics_doc` are resolved with idiomatic `# Errors` / `# Panics`
# rustdoc on public fns; `too_many_lines` is resolved at long test fns and
# coherent long encoders/drivers with tight per-fn
# `#[expect(..., reason = "...")]`. No runtime impact; no allocation and no
# runtime-surface change.
# SM-04a (moltke ruling a): `large_stack_arrays` is enabled; its five
# design-intentional runtime sites (Cache::new entries, ChInspector buf+scratch,
# the designed 2x64 KiB serving-path buffers, ResponseWorkspace::default owners,
# StartupDns recv_buf) carry tight per-constructor `#[expect(..., reason =
# "designed ...-resident fixed-profile buffer; no runtime heap")]`; the 11
# test-only staging buffers carry `reason = "test staging buffer, not runtime
# path"`. Buffers stay stack-resident; no runtime heap and no surface change.
# SM-05: enable the control-flow pedantic lints — `manual_let_else`,
# `match_same_arms`, `match_wildcard_for_single_variants`, `single_match_else`,
# `nonminimal_bool`, `needless_continue`, `if_not_else`, `unnested_or_patterns`,
# and the assert cluster (`manual_assert`, `manual_assert_eq`,
# `assert_is_empty`) — resolved at every site with idiomatic,
# behaviour-preserving rewrites on both feature matrices. Suppression stays
# per-site `#[expect(..., reason = "...")]` only where no idiomatic rewrite
# exists. No runtime/alloc/surface change; attributes are compile-time.
[lints.clippy]
uninlined_format_args = "warn"
must_use_candidate = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
cast_possible_truncation = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
too_many_lines = "warn"
large_stack_arrays = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
single_match_else = "warn"
nonminimal_bool = "warn"
needless_continue = "warn"
if_not_else = "warn"
unnested_or_patterns = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
assert_is_empty = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
manual_string_new = "warn"
format_push_string = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"
no_effect_underscore_binding = "warn"
used_underscore_binding = "warn"
default_trait_access = "warn"
ignored_unit_patterns = "warn"
struct_field_names = "warn"
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"
return_self_not_must_use = "warn"
derivable_impls = "warn"
needless_pass_by_value = "warn"
struct_excessive_bools = "warn"
similar_names = "warn"

[lib]
name = "alumina"
path = "src/lib.rs"

[[bin]]
name = "alumina"
path = "src/main.rs"

# harness = false: this test supplies its own `main()`, which the kernel
# enters on the true process main thread. It probes the main-order serving
# path (preallocate -> accept -> reset) under the deployment stack rlimit,
# evidence for M2: the inline serving workspaces must not overflow the
# deployment main thread's RLIMIT_STACK (see docs/build-plan.md stack bound).
[[test]]
name = "main_thread_stack"
path = "tests/main_thread_stack.rs"
harness = false

# harness = false: this binary steals fd 1 onto an unconsumed pipe and proves
# the native Linux serving loop keeps refusing connections (403) while the
# log sink is stalled on a full stdout, with no panic and whole-record drops
# bounded (R2 evidence for the nonblocking stdout sink).
[[test]]
name = "stdout_stall"
path = "tests/stdout_stall.rs"
harness = false

[[test]]
name = "monitor_stdout"
path = "tests/monitor_stdout.rs"
harness = false

[dependencies]
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
mio = { version = "=1.2.4", default-features = false, features = ["net", "os-poll", "os-ext"] }
getrandom = { version = "=0.4.3" }
# SIGTERM lifecycle: safe self-pipe route (oracle b3nx B18/B19, H1 selected).
# default-features=false keeps only the ungated flag/low_level surfaces; the
# `pipe` safe registration primitive writes into a pollable fd with no handler
# allocation in the signal path (evidence jvlx). mio os-ext unlocks SourceFd so
# the retained self-pipe read end registers on the single serving poll.
signal-hook = { version = "=0.4.5", default-features = false }
# Promoted from the already-resolved closure (mio/getrandom pull libc 0.2.190):
# minimal nonblocking-stdout fcntl + write boundary for the log sink. Pinned to
# the exact resolved version; no new closure node (contract intent 26l1.21.3).
libc = "=0.2.190"

[features]
# F1 counting allocator is opt-in so normal production releases are never
# instrumented; the foundation test harness enables it explicitly (README).
default = []
alloc-witness = []
# Proof-only fixture diagnostic: the built binary prints its own kernel facts
# to stderr at entry so fixtures can assert facts at the actual executable
# entry. Never part of `default`; compile-time gated, no policy effect, no
# privileged bypass, no runtime env/CLI override.
fixture-facts = []

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1

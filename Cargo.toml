[package]
name = "alumina"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Alumina phase-1 foundations: F0 toolchain pin, F1/F2/F4 witness scaffolds"

# SM-01: per-lint rollout proof — enable one pedantic lint and fix all its
# sites. `uninlined_format_args` is pure formatting; args are inlined at every
# site and no suppression is expected.
# SM-02: enable the second pedantic lint — `must_use_candidate` — and resolve
# every site with idiomatic `#[must_use]` (public API) or
# `#[expect(clippy::must_use_candidate, reason = "...")]` (test-local/private,
# value legitimately ignored). No runtime impact; attributes are compile-time.
# SM-03: enable the correctness lint — `unused_io_amount`. Its firing surface
# is a read/write byte count silently dropped via unwrap/expect-style
# consumption, which would truncate relayed tunnel data. The serving relay,
# DNS exchange and nonblocking log-sink paths already advance their offsets by
# the returned count; the audit found zero sites on the pinned toolchain, so
# the lint guards future regressions. No suppression expected.
# SM-04: enable the doc/hygiene cluster — `missing_errors_doc` and
# `missing_panics_doc` are resolved with idiomatic `# Errors` / `# Panics`
# rustdoc on public fns; `too_many_lines` is resolved at long test fns and
# coherent long encoders/drivers with tight per-fn
# `#[expect(..., reason = "...")]`. No runtime impact; no allocation and no
# runtime-surface change.
# SM-04a (moltke ruling a): `large_stack_arrays` is enabled; its five
# design-intentional runtime sites (Cache::new entries, ChInspector buf+scratch,
# the designed 2x64 KiB serving-path buffers, ResponseWorkspace::default owners,
# StartupDns recv_buf) carry tight per-constructor `#[expect(..., reason =
# "designed ...-resident fixed-profile buffer; no runtime heap")]`; the 11
# test-only staging buffers carry `reason = "test staging buffer, not runtime
# path"`. Buffers stay stack-resident; no runtime heap and no surface change.
# SM-05: enable the control-flow pedantic lints — `manual_let_else`,
# `match_same_arms`, `match_wildcard_for_single_variants`, `single_match_else`,
# `nonminimal_bool`, `needless_continue`, `if_not_else`, `unnested_or_patterns`,
# and the assert cluster (`manual_assert`, `manual_assert_eq`,
# `assert_is_empty`) — resolved at every site with idiomatic,
# behaviour-preserving rewrites on both feature matrices. Suppression stays
# per-site `#[expect(..., reason = "...")]` only where no idiomatic rewrite
# exists. No runtime/alloc/surface change; attributes are compile-time.
[lints.clippy]
uninlined_format_args = "warn"
must_use_candidate = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
cast_possible_truncation = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
# undocumented_unsafe_blocks: every `unsafe` node in the binary's unsafe
# surface (src/alloc.rs + src/log.rs) carries a `// SAFETY:` contract; no
# suppression attributes.
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
large_stack_arrays = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
single_match_else = "warn"
nonminimal_bool = "warn"
needless_continue = "warn"
if_not_else = "warn"
unnested_or_patterns = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
assert_is_empty = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
manual_string_new = "warn"
format_push_string = "warn"
items_after_statements = "warn"
semicolon_if_nothing_returned = "warn"
no_effect_underscore_binding = "warn"
used_underscore_binding = "warn"
default_trait_access = "warn"
ignored_unit_patterns = "warn"
struct_field_names = "warn"
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"
return_self_not_must_use = "warn"
derivable_impls = "warn"
needless_pass_by_value = "warn"
struct_excessive_bools = "warn"
similar_names = "warn"
redundant_clone = "warn"
redundant_else = "warn"
if_then_some_else_none = "warn"
option_if_let_else = "warn"
missing_const_for_fn = "warn"
unused_io_amount = "warn"
# SM-06: enable the liveness/correctness lint — `empty_loop`. Its firing
# surface is a bare `loop {}` with an empty body in the serving/runtime path —
# a busy-wait that stalls the single serving owner and burns CPU. The serving
# loop is made to yield/progress explicitly; nonblocking mio semantics are
# preserved with no blocking or allocation introduced.
empty_loop = "warn"
# SM-07: enable the liveness/energy lint — `missing_spin_loop`. Its firing
# surface is a busy-wait loop lacking a pause/yield hint on a hot
# serving/poll path. A clippy 1.99.0 positive control (`-F
# clippy::missing_spin_loop`) and a scan of the serving/runtime loops found
# zero sites on the pinned toolchain, so the lint guards future regressions.
# The idiomatic fix for any new site is an explicit `std::hint::spin_loop()`
# inside a body that is already a pure spin (nonblocking); never a blocking
# wait, an allocation, or a control-flow/spec change.
missing_spin_loop = "warn"
# SM-08: enable the correctness/typo lint — `eq_op`. Its firing surface is a
# self-comparison or self-operation (`a == a`, `a & a`, `a - a`, ...), which
# is almost always a typo'd second operand. A clippy 1.99.0 positive control
# (`-F clippy::eq_op`) on both feature matrices and a self-op scan of the
# dispatch/eligibility/serving logic found zero sites on the pinned toolchain,
# so the lint guards future regressions. Fixes are trivial idiomatic operand
# corrections; genuinely intentional sites carry a tight per-site
# `#[expect(clippy::eq_op, reason = "...")]`. No runtime/alloc/spec change.
eq_op = "warn"
# SM-09: enable the correctness/bound lint — `impossible_comparisons`. Its
# firing surface is an always-false comparison (`a == b` where the types can
# never overlap — e.g. a `usize` against a bound it can never reach), which
# usually exposes a dead length/bound guard hiding a wrong bound. A clippy
# 1.99.0 positive control (`-F clippy::impossible_comparisons`) on both feature
# matrices found zero sites on the pinned toolchain, so the lint guards
# future regressions. Fixes correct the wrong bound or remove a proven-dead
# guard; an `#[expect(clippy::impossible_comparisons, reason = "...")]` is
# reserved for a dead guard that genuinely cannot be reasoned about (a
# red flag to stop and report, not suppress). No runtime/alloc/spec change;
# the attribute is compile-time.
impossible_comparisons = "warn"
# SM-10: enable the style/correctness lint — `assign_op_pattern`. Its firing
# surface is a self-assignment (`a = a op b`) written where an idiomatic
# compound assignment (`a op= b`) is available — clearer, and single-evaluation
# of the accumulator on buffer-length/offset accumulation. A clippy 1.99.0
# positive control (`-F clippy::assign_op_pattern`) on both feature matrices, a
# toggled plant probe (`x = x + n` fires `assign_op_pattern`), and a self-assign
# scan of `src/` + `tests/` found zero lint-proven sites on the pinned
# toolchain (the sole `failed = failed || err` boolean accumulator is outside
# the lint's `op=` firing surface), so the lint guards future regressions. No
# runtime/alloc/spec change; the attribute is compile-time.
assign_op_pattern = "warn"
# SM-11: enable the clarity/correctness lint — `bool_comparison`. Its firing
# surface is a literal boolean compared against `true`/`false` (`x == true`,
# `x != false`) where the boolean variable reads directly. The idiomatic
# rewrites are behaviour-preserving for literally-`bool` values: `x == true`
# => `x`, `x == false` => `!x`, `x != true` => `!x`, `x != false` => `x`.
# Sites live in gate/policy checks (gate.rs / eligibility.rs / enforcement)
# complementing the enabled `nonminimal_bool`. No runtime/alloc/spec change.
bool_comparison = "warn"
# SM-12: enable the clarity/correctness lint — `len_zero`. Its firing
# surface is a length-vs-zero comparison (`x.len() == 0`, `x.len() != 0`,
# `x.len() > 0`, `x.len() < 1`) on a type with `is_empty()` available; the
# idiomatic rewrites are `.is_empty()` / `!.is_empty()`, complementing the
# already-enabled `assert_is_empty`. A clippy 1.99.0 positive control
# (`-F clippy::len_zero`) on a `Vec`/slice probe confirmed the lint fires
# on `== 0`, `!= 0` and `> 0`; the only `.len()`-to-zero sites in
# `src/` + `tests/` are `LogStore` predicates — a fixed-slot queue type
# with `len()` but no `is_empty()` (adding one would be a runtime-surface
# change), so they are outside the lint's firing surface. Zero
# lint-proven sites on the pinned toolchain: the lint guards future
# regressions. No runtime/alloc/spec change; the attribute is compile-time.
len_zero = "warn"
# SM-13: enable the clarity/correctness lint — `comparison_to_empty`. Its
# firing surface is a comparison against an empty literal (`x == ""`,
# `x != b""`, `x == []`, `x == String::new()`) where the idiomatic
# `.is_empty()` / `!.is_empty()` reads clearer, complementing the
# already-enabled `len_zero` and `assert_is_empty`. A clippy 1.99.0 positive
# control (`-F clippy::comparison_to_empty`) on a str/slice probe confirmed
# the lint fires on `== ""` and `== []`; a scan of `src/` + `tests/` found
# zero lint-proven sites on the pinned toolchain (the `String::new()`
# sites at src/log.rs:1478,1508 and src/resolver.rs:214 are collectors /
# error-payload construction, not comparisons — outside the firing surface).
# Zero lint-proven sites: the lint guards future regressions. No runtime/
# alloc/spec change; the attribute is compile-time.
comparison_to_empty = "warn"
# SM-14: enable the clarity/correctness lint — `identity_op`. Its firing
# surface is an identity operation (`x + 0`, `x * 1`, `x | 0`, `x << 0`,
# `x & all-ones`, ...) that evaluates to its operand — dead framing-math
# no-ops that obscure intent. A clippy 1.99.0 positive control (`-F
# clippy::identity_op`) on both feature matrices plus a planted `x + 0`
# probe (which fires `identity_op`, proving the lint is armed) found zero
# lint-proven sites on the pinned toolchain, so the lint guards future
# regressions. A genuinely intentional identity, should one arise, carries
# a tight per-site `#[expect(clippy::identity_op, reason = "...")]`. No
# runtime/alloc/spec change; the attribute is compile-time.
identity_op = "warn"
# SM-15: enable the correctness/scan lint — `never_loop`. Its firing surface
# is a `loop` whose body can only ever execute once — an unconditional
# `break`/`return` on the first iteration — which is usually a parsing/scan
# bug where a loop written to walk a buffer never advances. A clippy 1.99.0
# positive control (`-F clippy::never_loop`) on both feature matrices plus a
# planted `loop { …; break; }` probe (which fires `never_loop`, proving the
# lint is armed — the gate fails where a site exists) found zero lint-proven
# sites on the pinned toolchain, so the lint guards future regressions. A
# genuinely intentional once-only loop carries a tight per-site
# `#[expect(clippy::never_loop, reason = "...")]`. No runtime/alloc/spec
# change; the attribute is compile-time.
never_loop = "warn"
# SM-16: enable the correctness/arithmetic lint — `erasing_op`. Its firing
# surface is a binary op that always erases to zero (`x * 0`, `x & 0`,
# `x << 64`, ...) — dead math in counters/masks that hides the intended
# operation. A clippy 1.99.0 positive control (`-F clippy::erasing_op`) on
# both feature matrices plus a planted `x * 0` probe (which fires
# `erasing_op`, proving the lint is armed — the gate fails where a site
# exists) found zero lint-proven sites on the pinned toolchain, so the lint
# guards future regressions. A genuinely intentional erasing/type- or
# mask-load-bearing op carries a tight per-site
# `#[expect(clippy::erasing_op, reason = "...")]`. No runtime/alloc/spec
# change; the attribute is compile-time.
erasing_op = "warn"
# SM-17: enable the correctness/arithmetic lint — `modulo_one`. Its firing
# surface is a remainder against a constant one (`x % 1`, `x % -1`), which is
# always zero — a vacuous remainder that hides a mistyped divisor (a `% 0`
# divisor would panic, so this usually catches a typo'd 0/1 denominator). A
# clippy 1.99.0 positive control (`-F clippy::modulo_one`) on both feature
# matrices plus a planted `x % 1` probe (which fires `modulo_one`, proving the
# lint is armed — the gate fails where a site exists) found zero lint-proven
# sites on the pinned toolchain, so the lint guards future regressions. A
# genuinely intentional remainder-by-one type- or denominator-load-bearing op
# carries a tight per-site `#[expect(clippy::modulo_one, reason = "...")]`.
# No runtime/alloc/spec change; the attribute is compile-time.
modulo_one = "warn"
# SM-18: enable the correctness/clamp lint — `min_max`. Its firing
# surface is a min/max clamp pair whose result is provably constant —
# e.g. swapped clamp bounds `x.min(10).max(20)` (always `20`) or
# `x.max(20).min(10)` (always `10`) — usually a swapped bound in
# buffer/size clamp logic. A clippy 1.99.0 positive control (`-F
# clippy::min_max`) on both feature matrices plus a planted constant-
# bound clamp probe (which fires `min_max` — the gate fails with a
# nonzero exit where a site exists, proven on both matrices) found zero
# lint-proven sites on the pinned toolchain, so the lint guards future
# regressions. A genuinely intentional constant clamp carries a tight
# per-site `#[expect(clippy::min_max, reason = "...")]`.
# No runtime/alloc/spec change; the attribute is compile-time.
min_max = "warn"

[lib]
name = "alumina"
path = "src/lib.rs"

[[bin]]
name = "alumina"
path = "src/main.rs"

# harness = false: this test supplies its own `main()`, which the kernel
# enters on the true process main thread. It probes the main-order serving
# path (preallocate -> accept -> reset) under the deployment stack rlimit,
# evidence for M2: the inline serving workspaces must not overflow the
# deployment main thread's RLIMIT_STACK (see docs/build-plan.md stack bound).
[[test]]
name = "main_thread_stack"
path = "tests/main_thread_stack.rs"
harness = false

# harness = false: this binary steals fd 1 onto an unconsumed pipe and proves
# the native Linux serving loop keeps refusing connections (403) while the
# log sink is stalled on a full stdout, with no panic and whole-record drops
# bounded (R2 evidence for the nonblocking stdout sink).
[[test]]
name = "stdout_stall"
path = "tests/stdout_stall.rs"
harness = false

[[test]]
name = "monitor_stdout"
path = "tests/monitor_stdout.rs"
harness = false

[dependencies]
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
mio = { version = "=1.2.4", default-features = false, features = ["net", "os-poll", "os-ext"] }
getrandom = { version = "=0.4.3" }
# SIGTERM lifecycle: safe self-pipe route (oracle b3nx B18/B19, H1 selected).
# default-features=false keeps only the ungated flag/low_level surfaces; the
# `pipe` safe registration primitive writes into a pollable fd with no handler
# allocation in the signal path (evidence jvlx). mio os-ext unlocks SourceFd so
# the retained self-pipe read end registers on the single serving poll.
signal-hook = { version = "=0.4.5", default-features = false }
# Promoted from the already-resolved closure (mio/getrandom pull libc 0.2.190):
# minimal nonblocking-stdout fcntl + write boundary for the log sink. Pinned to
# the exact resolved version; no new closure node (contract intent 26l1.21.3).
libc = "=0.2.190"

[features]
# F1 counting allocator is opt-in so normal production releases are never
# instrumented; the foundation test harness enables it explicitly (README).
default = []
alloc-witness = []
# Proof-only fixture diagnostic: the built binary prints its own kernel facts
# to stderr at entry so fixtures can assert facts at the actual executable
# entry. Never part of `default`; compile-time gated, no policy effect, no
# privileged bypass, no runtime env/CLI override.
fixture-facts = []

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1

# Gate runs are exact-input: no on-disk example database and a per-test
# derived seed, so a failing gate run is reproducible. The per-property
# `#[hegel::test(test_cases = ..., derandomize = true)]` attribute owns the
# case count; these profiles own the on-disk database and restate
# `derandomize` so a CI-detected run keeps the same exact-input semantics
# instead of resting on the shipped defaults. `development` and `ci` are
# siblings over the shipped base profile, so a CI run selects `ci` and never
# this file's `development` block. A committed
# #[hegel::reproduce_failure] blob replays only that capture (generation is
# skipped) and panics once the fault is fixed, so a durable corpus entry is a
# deliberate separate replay, not a gate attribute.
[profiles.development]
derandomize = true
database = "disabled"

# CI selects this profile from the CI environment; a project section merges
# over the shipped `ci` delta, so the explicit keys here pin exact-input
# settings without dropping the shipped `suppress_health_check`.
[profiles.ci]
derandomize = true
database = "disabled"

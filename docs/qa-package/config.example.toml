# 127.0.0.1:<port> for local testQA / cooperative sidecar testing;
# 0.0.0.0:<port> for a dedicated VPC appliance (hard RCE egress confinement).
listen = "127.0.0.1:5353"
startup_unresolved_allowance = 0
# Validated resolver set: 1..=5 numeric unicast IPv4/IPv6 addresses, no zone
# identifiers, each in one of three forms (docs/alumina-proxy.md
# §Configuration & DNS; §Directory — three resolver trust forms):
#   IP                  -- plain DNS, port 53 (tolerated degraded trust; warns)
#   IP#fqdn             -- DoT, port 853, CA-chain validation
#   IP#fqdn#pin-sha256= -- DoT, port 853, STRICT SPKI pin + FQDN/SAN validation
# The FQDN is the validated SNI/SAN match target; presence of an FQDN selects
# DoT port 853 and NEVER a silent plain-DNS fallback. There is no dynamic pin
# update: the pin is fixed at startup and a mismatch fails the handshake closed.
#
# !!! The pin-sha256 values below are SYNTAX PLACEHOLDERS (the null pin) ---
#     replace each with the resolver's real SPKI SHA-256 (unpadded base64 of
#     the 32-byte subject public key info digest, obtained out-of-band / from
#     the resolver operator). A wrong pin fails closed, so an un-replaced
#     placeholder makes the entry unusable by design, never silently insecure.
#
# Deployment picks 1..=5 entries from the public DNS services it trusts (each
# has a documented DoT hostname; IPv6 forms are equally valid). Bare-IP entries
# remain valid but each emits one startup warning (degraded trust form).
resolver = ["1.1.1.1#cloudflare-dns.com#pin-sha256=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "8.8.8.8#dns.google#pin-sha256=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "9.9.9.9#dns.quad9.net#pin-sha256=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "208.67.222.222#dns.opendns.com#pin-sha256=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "94.140.14.14#dns.adguard.com#pin-sha256=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"]
# Mandatory keyed allowlist tables (docs/alumina-proxy.md §Keyed configuration
# schema): the [allowed_fqdn."<fqdn>:<port>"] table keys ARE the allowlist
# (1..=32 tables, each a literal <fqdn>:<port>, unique after normalization);
# [any_illegal] carries exactly the four per-control keys connect_parse,
# host_not_allowlisted, tls_profile, ech, each an inline { action, scope } table
# (action "notify"|"block"; scope "connection"|"all").
# Every [allowed_fqdn] table carries the mandatory early_data and ja4 inline
# tables, each { action = "notify"|"block", scope = "connection"|"fqdn"|"all" }
# or the bare "ignore" opt-out, plus the mandatory dns_assurance string key
# (resolver_trusted | resolver_authenticated | delegated_dnssec); every key is
# mandatory, a missing/extra/unknown key or table is exit 78.
[any_illegal]
connect_parse = { action = "notify", scope = "connection" }
host_not_allowlisted = { action = "notify", scope = "connection" }
tls_profile = { action = "notify", scope = "connection" }
ech = { action = "notify", scope = "connection" }
# Optional per-class all-scope gate bars (docs/alumina-proxy.md §Keyed
# configuration schema): each section absent -> defaults threshold = 1 (the
# FIRST deviation of that class arms all-scope block, sticky until restart),
# window_secs = 900. Raising a threshold is the operator's deliberate choice to
# tolerate a bounded burst — never a hidden tolerated rate. bad_handshake counts
# ConnectParse/TlsProfile/Ech facts; illegal_fqdn counts
# HostNotAllowlisted facts; ja4 counts only its Block-All facts. An [early_data] gate
# section is rejected at load (exit 78): its all-scope block action is unreachable by
# construction (early-data block scope is connection-only).
[bad_handshake]
threshold   = 1
window_secs = 900
[illegal_fqdn]
threshold   = 1
window_secs = 900
[ja4]
threshold   = 1
window_secs = 900
[allowed_fqdn."api.github.com:443"]
early_data = { action = "notify", scope = "connection" }
ja4 = { action = "notify", scope = "connection" }
dns_assurance = "resolver_trusted"
[allowed_fqdn."example.com:443"]
early_data = { action = "notify", scope = "connection" }
ja4 = { action = "notify", scope = "connection" }
dns_assurance = "resolver_trusted"
[allowed_fqdn."www.example.net:443"]
early_data = { action = "notify", scope = "connection" }
ja4 = { action = "notify", scope = "connection" }
dns_assurance = "resolver_trusted"

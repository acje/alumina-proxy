# HAProxy 3.4.7 forward-proxy (HTTP CONNECT) config for the e2-micro benchmark
# suite (bench-suite-20261027, evidence bead alumina-d59gq).
#
# Semantics: HTTP-mode CONNECT relay. HAProxy receives "CONNECT example.com:443
# HTTP/1.1" on 127.0.0.1:8080, forwards the CONNECT request line to the origin
# (8.8.8.8:443, the in-container loopback alias), relays the origin's
# "200 Connection Established", then buffers the session into a full-duplex
# tunnel. This is the same HCM CONNECT-relay model Envoy's canonical
# proxy_connect.yaml uses, and the in-suite TLS1.3 echo backend answers the
# leading CONNECT preamble (see soft-tolerant _serve in bench_workload.py)
# before the TLS handshake -- the origin-side accommodation that makes the
# relay model measureable against direct-tunnel (alumina) proxies.
#
# option http_proxy (direct-tunnel forward proxy) was removed in HAProxy 2.5,
# and the do-resolve/set-dst dynamic-destination replacement does not route
# the HTTP-mode connect in 3.4.7 (verified: set-dst+set-dst-port produce no
# origin connection; 503). The relay model is HAProxy's supported CONNECT
# mechanism and matches the Envoy leg of this suite.
#
# The config is single-origin by construction: the workload drives only
# example.com:443 -> the static 8.8.8.8:443 origin. The CONNECT authority
# (Host header) is preserved verbatim to the origin; the expose-resolved-IP
# leg that alumina performs internally is not present here (disclosed in the
# suite doc; DNS is a per-name lookup and not a measured load factor).
#
# nbthread 2 matches the e2-micro 2-vCPU target (one worker per core, per
# Envoy's own benchmarking FAQ). No allowlist (alumina-specific; not on the
# measured golden path).
global
    nbthread 2
    maxconn 4096
    tune.bufsize 32768

defaults
    mode http
    # M-02 e2micro-confounds: disable Nagle on both the client-facing and
    # origin-facing sides to avoid the storm first-segment delayed-ACK/Nagle
    # stall (Envoy and alumina set TCP_NODELAY upstream, M-01). HAProxy 3.4.7's
    # TCP_NODELAY-for-HTTP option is "option http-no-delay" (replaces the
    # historical "tcp-nodelay" name; parser-suggested on this pinned binary),
    # and set at defaults it applies to both sides of the CONNECT relay.
    option http-no-delay
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout tunnel 30s
    retries 1

frontend proxy_in
    bind 127.0.0.1:8080
    # Only CONNECT requests are forwarded; everything else is rejected.
    http-request deny if !{ method CONNECT }
    default_backend origin

backend origin
    mode http
    server origin 8.8.8.8:443
